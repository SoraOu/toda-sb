function asgSel(){const a=g$("assoc").value;if(!a)return;const c=A.TODA.includes(a)?"TODA":"PODA";if(g$("cat").value!=c){g$("cat").value=c;fillA();g$("assoc").value=a}}

const LBL=[["Name","name"],["Address","addr"],["Barangay","brgy"],["Contact","phone",1],["Classification","cls"],["Type","cat"],["Association","assoc"],["Date issued","issued"],["Expires","exp"],["Status","status"],["Plate","plate"],["MTOP No.","mtop"],["OR No.","or"],["OR date","ordate"],["Vehicle type","vtype"],["Make/model","model"],["Color","color"],["Chassis No.","chassis",1]];
function diff(a,b){const o=n=>{const x=data.find(d=>d.id==n);return x?x.name:"—"},t=[];LBL.forEach(([l,k,hide])=>{if((a[k]||"")!=(b[k]||""))t.push(hide?l+": changed":l+": "+(a[k]||"—")+" → "+(b[k]||"—"))});if(a.asg!=b.asg)t.push("Operator: "+o(a.asg)+" → "+o(b.asg));if((a.photo||null)!=(b.photo||null))t.push("Photo updated");return t.join("; ")}
function save(e){e.preventDefault();const m=g$("msg"),fail=t=>{m.textContent=t;toast(t);m.scrollIntoView&&m.scrollIntoView({block:"center",behavior:"smooth"})};m.textContent="";
try{const f=Object.fromEntries(new FormData(e.target)),dr=f.cls=="Driver",ed=editId?data.find(x=>x.id==editId):null,others=data.filter(x=>!ed||x.id!=ed.id),warn=[];let rec,cat;
if(!CL.includes(f.cls))return fail("Choose a classification.");
const nm=(f.name||"").trim(),ad=(f.addr||"").trim();if(!nm||!ad)return fail("Full name and address are required.");
const dn=others.find(x=>!x.arch&&lc(x.name)==lc(nm)&&x.brgy==f.brgy);if(dn)warn.push(nm+" is already registered in "+f.brgy);
if(dr){const p=data.find(r=>r.id==f.asg&&r.cls!="Driver"&&!r.arch);if(!p)return fail("Choose the operator this driver works for.");if(p.cat!=f.cat)return fail("The operator belongs to a different franchise type.");cat=p.cat;
rec={cls:"Driver",asg:p.id,cat:p.cat,assoc:p.assoc,issued:"",exp:"",status:"",plate:"",mtop:"",or:"",ordate:"",vtype:"",model:"",color:"",chassis:""}}
else{cat=f.cat;if(!A[f.cat]||!A[f.cat].includes(f.assoc))return fail("Association does not belong to the selected franchise type.");
f.mtop=(f.mtop||"").trim();if(!f.mtop)return fail("MTOP No. is required for operators.");const mm=others.find(x=>x.mtop&&lc(x.mtop)==lc(f.mtop));if(mm)return fail("MTOP No. "+f.mtop+" is already used by "+mm.name+(mm.arch?" (archived)":"")+".");
[["plate","Plate"],["or","OR No."],["chassis","Chassis No."]].forEach(([k,l])=>{const v=(f[k]||"").trim();if(!v)return;const o=others.find(x=>!x.arch&&lc(x[k])==lc(v));if(o)warn.push(l+" "+v+" is also used by "+o.name)});
const calc=dec31(f.issued),keep=ed&&(ed.hist&&ed.hist.length||(f.issued||"")==(ed.issued||""))&&ed.exp;
rec={cls:f.cls,asg:null,cat:f.cat,assoc:f.assoc,issued:f.issued||"",exp:keep?ed.exp:calc,status:f.status,plate:f.plate||"",mtop:f.mtop,or:f.or||"",ordate:f.ordate||"",vtype:f.vtype||"",model:f.model||"",color:f.color||"",chassis:f.chassis||""}}
const wk=warn.join("|");if(warn.length&&e.target.dataset.warned!=wk){e.target.dataset.warned=wk;return fail("Possible duplicate: "+warn.join("; ")+". Press Save again to confirm, or correct the entry.")}
const base={name:nm,addr:ad,brgy:f.brgy,phone:f.phone||""};
let sc=null;if(!dr){const old=ed?ed.status:"Active",ns=rec.status,hard=ns=="Suspended"||ns=="Cancelled";if(ed?ns!=old:hard){const rs=(f.sreason||"").trim(),by=(f.sby||"").trim();if(hard&&(!rs||!by))return fail("Enter the reason and who decided for the "+ns.toLowerCase()+" status.");sc={date:f.sdate||iso(0),from:ed?old:"",to:ns,reason:rs,by,role}}}
if(ed){const before={...ed};Object.assign(ed,base,rec);ed.photo=shot;if(sc){ed.sh=ed.sh||[];ed.sh.unshift(sc)}let extra="";if(!dr){const ds=data.filter(d=>d.asg==ed.id);ds.forEach(d=>{d.cat=ed.cat;d.assoc=ed.assoc});if(ds.length&&(before.cat!=ed.cat||before.assoc!=ed.assoc))extra=" (updated "+ds.length+" driver"+(ds.length>1?"s":"")+")"}
L("Edited "+ed.name+": "+(diff(before,ed)||"no changes")+extra);const id=ed.id;closeModal();draw();prof(id);toast("Saved changes to "+ed.name);return}
{const nr=norm(Object.assign({id:nextId++,pub:false,photo:shot,ref:Math.random().toString(36).slice(2,18)},base,rec));if(sc)nr.sh=[sc];data.push(nr)}L("Added "+f.cls+" "+cat+" "+nm);
view=cat+" Holders";flt=fresh();closeModal();draw();toast("Saved: "+nm)}catch(err){fail("Could not save: "+err.message)}}
function persist(){try{localStorage.setItem("mtpfms3",JSON.stringify({data,log,nextId,lastBk,chg}))}catch(e){storeOK=false;toast("Not saved to this browser. Use Export backup to keep your records.")}}
function toast(t){const x=g$("toast");if(!x)return;x.textContent=t;x.style.display="block";clearTimeout(x.t);x.t=setTimeout(()=>x.style.display="none",3500)}
function exportBk(){lastBk=new Date().toISOString();chg=0;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({data,log,nextId,exportedAt:lastBk})],{type:"application/json"}));a.download="mtpfms-backup-"+iso(0)+".json";a.click();persist();draw()}
function importBk(el){const f=el.files[0];el.value="";if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!Array.isArray(o.data)||o.data.some(r=>!r||!r.cls||!("asg" in r)))throw 0;data=o.data.map(norm);lastBk=o.exportedAt||lastBk;chg=0;log.length=0;(o.log||[]).forEach(l=>log.push(l));nextId=o.nextId||nextId+1;persist();draw();toast("Backup restored")}catch(e){toast("That file is not a valid backup for this version.")}};rd.readAsText(f)}
if(SAVED&&Array.isArray(SAVED.data)&&SAVED.data.every(r=>r&&"asg" in r)){data=SAVED.data.map(norm);(SAVED.log||[]).forEach(l=>log.push(l));nextId=SAVED.nextId||nextId;lastBk=SAVED.lastBk||null;chg=SAVED.chg||0}
/* ===== Status history, transfers, data quality ===== */
function histSec(r){const sh=r.sh||[],tr=r.tr||[];let h="";
if(sh.length)h+=`<section><h3>Status history</h3><ul class="hist">${sh.map(x=>`<li><b>${esc(x.date)}</b>: ${x.from?esc(x.from)+" → ":""}${esc(x.to)}${x.reason?` · Reason: ${esc(x.reason)}`:""}${x.by?` · Decided by: ${esc(x.by)}`:""}</li>`).join("")}</ul></section>`;
if(tr.length)h+=`<section><h3>Transfers and changes</h3><ul class="hist">${tr.map(x=>`<li><b>${esc(x.date)}</b>: ${esc(x.fromName)} → ${esc(x.toName)}${x.fromAssoc!=x.toAssoc?` · ${esc(x.fromAssoc)} → ${esc(x.toAssoc)}`:""}${x.note?` · ${esc(x.note)}`:""}${x.by?` · Approved by: ${esc(x.by)}`:""}</li>`).join("")}</ul></section>`;return h}
function stChg(){const b=g$("sc");if(!b)return;const ed=editId?data.find(x=>x.id==editId):null,ns=document.querySelector("[name=status]"),dr=g$("cl").value=="Driver",v=ns?ns.value:"",hard=v=="Suspended"||v=="Cancelled",need=!dr&&(ed?v!=ed.status:hard);
b.hidden=!need;b.querySelectorAll("input").forEach(i=>i.disabled=!need);g$("sreq").textContent=hard?"(reason and decided by are required)":"(optional details)";const d=b.querySelector("[name=sdate]");if(need&&!d.value)d.value=iso(0)}
function trPanel(r){const sel=["TODA","PODA"].map(t=>`<optgroup label="${t}">`+A[t].map(a=>`<option ${a==r.assoc?"selected":""}>${a}</option>`).join("")+`</optgroup>`).join("");
return `<div class="note act noprint"><b>Record a transfer or change</b><p class="hint" style="margin:4px 0 8px">The current holder and association stay on record in the history. MTOP, plate and vehicle details stay with the franchise. If the holder changes, the old photo is removed so a new one can be taken.</p><div class="f"><label>New holder name*<input id="tn" value="${esc(r.name)}"></label><label>Address*<input id="ta" value="${esc(r.addr)}"></label><label>Barangay*<select id="tb">${BR.map(b=>`<option ${b==r.brgy?"selected":""}>${esc(b)}</option>`).join("")}</select></label><label>Contact number<input id="tp" value="${esc(r.phone)}"></label><label>Association<select id="tas">${sel}</select></label><label>Date of transfer*<input type="date" id="td" value="${iso(0)}"></label><label>Approved by*<input id="tby" placeholder="Name, office or resolution no."></label><label>Remarks<input id="tnote" placeholder="e.g. sold to nephew, moved to another TODA"></label></div><div style="margin-top:8px"><button class="btn" onclick="doTransfer(${r.id})">Confirm transfer</button><button class="btn alt" onclick="pa(${r.id},null)">Cancel</button></div></div>`}
function doTransfer(id){const r=data.find(x=>x.id==id);if(!r||!isAdm()||r.cls=="Driver"||r.arch)return;
const nm=g$("tn").value.trim(),ad=g$("ta").value.trim(),b=g$("tb").value,ph=g$("tp").value.trim(),as=g$("tas").value,dt=g$("td").value,by=g$("tby").value.trim(),nt=g$("tnote").value.trim();
if(!nm||!ad||!b)return toast("New holder name, address and barangay are required.");
if(!dt||!by)return toast("Enter the transfer date and who approved it.");
const hc=lc(nm)!=lc(r.name);if(!hc&&as==r.assoc)return toast("Change the holder or the association to record a transfer.");
const nc=A.TODA.includes(as)?"TODA":"PODA",e={date:dt,fromName:r.name,toName:nm,fromAssoc:r.assoc,toAssoc:as,note:nt,by,role};
r.tr=r.tr||[];r.tr.unshift(e);data.filter(d=>d.asg==r.id).forEach(d=>{d.assoc=as;d.cat=nc});
r.name=nm;r.addr=ad;r.brgy=b;r.phone=ph;r.assoc=as;r.cat=nc;if(hc)r.photo=null;
L("Transfer: "+e.fromName+" → "+nm+(as!=e.fromAssoc?"; association "+e.fromAssoc+" → "+as:"")+" (approved by "+by+")");
PA=null;draw();prof(id);toast("Transfer recorded")}
function dqData(){const rows=D(),miss=[],groups=[],v=x=>String(x||"").trim().toLowerCase(),ops=rows.filter(r=>r.cls!="Driver");
rows.forEach(r=>{const m=[];if(r.cls!="Driver"&&!v(r.plate))m.push("Plate");if(!r.photo)m.push("Photo");if(!v(r.phone))m.push("Contact");if(m.length)miss.push([r,m])});
const nk=r=>String(r.name).toLowerCase().replace(/\(sample\)/g,"").replace(/[^\p{L}\p{N} ]/gu," ").split(/\s+/).filter(Boolean).sort().join(" ");
const grp=(label,key,list,show)=>{const m={};list.forEach(r=>{const k=key(r);if(k)(m[k]=m[k]||[]).push(r)});Object.values(m).filter(g=>g.length>1).forEach(g=>groups.push([label,show(g[0]),g]))};
grp("Same name and barangay",r=>nk(r)&&nk(r)+"|"+r.brgy,rows,g=>g[0].name+" · "+g[0].brgy);
[["Plate number","plate"],["MTOP No.","mtop"],["OR No.","or"],["Chassis No.","chassis"]].forEach(([l,k])=>grp(l,r=>v(r[k]),ops,g=>g[0][k]));
return{miss,groups}}
function dq(){if(!isAdm())return `<h2>Data Quality</h2><p>Available to administrators only.</p>`;
const{miss,groups}=dqData(),f=flt.dq||"",cnt=k=>miss.filter(x=>x[1].includes(k)).length,list=miss.filter(x=>!f||x[1].includes(f)),cap=300,
cell=(r,m,k)=>k=="Plate"&&r.cls=="Driver"?"n/a":m.includes(k)?"<b>Missing</b>":"OK";
return `<h2>Data Quality</h2><p class="hint">Archived records are left out. Plate applies to operators only. Duplicates are matched on the same name in the same barangay (word order and punctuation ignored), or on the same plate, MTOP, OR or chassis number. Open a holder and use Edit to fix a record.</p>
<div class="cards"><div class="card"><b>${cnt("Plate")}</b>Missing plate</div><div class="card"><b>${cnt("Photo")}</b>Missing photo</div><div class="card"><b>${cnt("Contact")}</b>Missing contact no.</div><div class="card"><b>${groups.length}</b>Possible duplicate groups</div></div>
<div class="panel"><h3>Missing details (${list.length})</h3><div class="tools"><select onchange="flt.dq=this.value;draw()">${[["","Any missing detail"],["Plate","Missing plate"],["Photo","Missing photo"],["Contact","Missing contact no."]].map(o=>`<option value="${o[0]}" ${o[0]==f?"selected":""}>${o[1]}</option>`).join("")}</select><button class="btn alt" onclick="dqCsv('miss')">Export CSV</button></div>
<div class="tw"><table class="rt"><tr><th>Holder</th><th>Type</th><th>Association</th><th>Barangay</th><th>Plate</th><th>Photo</th><th>Contact no.</th></tr>${list.slice(0,cap).map(([r,m])=>`<tr><td data-label="Holder"><a onclick="prof(${r.id})">${esc(r.name)}</a>${r.cls=="Driver"?" <small>(driver)</small>":""}</td><td data-label="Type">${r.cat}</td><td data-label="Association">${esc(r.assoc)}</td><td data-label="Barangay">${esc(r.brgy)}</td><td data-label="Plate">${cell(r,m,"Plate")}</td><td data-label="Photo">${cell(r,m,"Photo")}</td><td data-label="Contact no.">${cell(r,m,"Contact")}</td></tr>`).join("")||`<tr><td colspan="7">Nothing missing.</td></tr>`}</table></div>${list.length>cap?`<p class="hint">Showing the first ${cap} of ${list.length}. Export CSV for the full list.</p>`:""}</div>
<div class="panel"><h3>Possible duplicates (${groups.length})</h3><div class="tools"><button class="btn alt" onclick="dqCsv('dup')">Export CSV</button></div>
<div class="tw"><table class="rt"><tr><th>Matched on</th><th>Value</th><th>Holders</th></tr>${groups.slice(0,cap).map(g=>`<tr><td data-label="Matched on">${g[0]}</td><td data-label="Value">${esc(g[1])}</td><td data-label="Holders" style="white-space:normal">${g[2].map(r=>`<a onclick="prof(${r.id})">${esc(r.name)}</a> <small>(${esc(r.brgy)})</small>`).join(", ")}</td></tr>`).join("")||`<tr><td colspan="3">No possible duplicates found.</td></tr>`}</table></div>${groups.length>cap?`<p class="hint">Showing the first ${cap} of ${groups.length}.</p>`:""}</div>`}
function dqCsv(t){if(!isAdm())return;const{miss,groups}=dqData();let head,body;
if(t=="miss"){head=["Holder","Classification","Type","Association","Barangay","Missing"];body=miss.map(([r,m])=>[r.name,r.cls,r.cat,r.assoc,r.brgy,m.join("; ")])}
else{head=["Matched on","Value","Holders"];body=groups.map(g=>[g[0],g[1],g[2].map(r=>r.name+" ("+r.brgy+")").join("; ")])}
dlf("data-quality-"+t+"-"+iso(0)+".csv",[head.map(cq).join(",")].concat(body.map(r=>r.map(cq).join(","))).join("\r\n"));L("Exported data quality report ("+t+")")}

applyTheme();draw();
